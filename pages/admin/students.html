<!DOCTYPE html>
<html lang="en">
<head>

  <title>Students - Internship Eligibility Checker</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-role="admin" data-active="students" data-title="Students">

    <div class="toolbar"><input id="search" type="search" placeholder="Search name, email or branch"></div>

        <div id="profileBody"></div></div>
    </div>
  </div>
  <script src="../../js/config.js"></script>
  <script src="../../js/services/apiClient.js"></script>
  <script src="../../js/services/services.js"></script>
  <script src="../../js/components/ui.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/pages/admin-students.js"></script>
</body>
</html>
