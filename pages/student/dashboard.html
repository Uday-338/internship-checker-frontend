<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Internship Eligibility Checker</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-role="student" data-active="dashboard" data-title="Dashboard">
  <div id="page">
    <div class="page-head"><div><h1 id="welcome">Welcome</h1><p>Here is a quick look at your internship journey.</p></div>
      <a class="btn" href="internships.html">Browse internships</a></div>
    <div id="profileAlert" class="alert warn hidden">Your profile is incomplete. Eligibility results are only accurate when your CGPA and skills are filled in. <a href="profile.html">Complete profile</a></div>
    <div class="grid g4" id="stats"><div class="card stat"><div class="num" id="sInternships">-</div><div class="lbl">Open internships</div></div><div class="card stat s2"><div class="num" id="sApplied">-</div><div class="lbl">Applications</div></div><div class="card stat s3"><div class="num" id="sShort">-</div><div class="lbl">Shortlisted</div></div><div class="card stat s4"><div class="num" id="sSel">-</div><div class="lbl">Selected</div></div></div>
    <h2 style="margin:26px 0 12px">Recent applications</h2>
    <div id="recent"><div class="spinner">Loading...</div></div>
  </div>
  <script src="../../js/config.js"></script>
  <script src="../../js/services/apiClient.js"></script>
  <script src="../../js/services/services.js"></script>
  <script src="../../js/components/ui.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/pages/student-dashboard.js"></script>
</body>
</html>
