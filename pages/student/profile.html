<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - Internship Eligibility Checker</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-role="student" data-active="profile" data-title="My Profile">
  <div id="page">
    <div class="page-head"><div><h1>My profile</h1><p>Eligibility checks use these details, so keep them up to date.</p></div></div>
    <div class="card" style="max-width:760px">
      <form id="profileForm">
        <div class="form-grid">
          <div class="field"><label for="name">Name</label><input id="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" type="email" readonly></div>
          <div class="field"><label for="phone">Phone number</label><input id="phone" pattern="[0-9]{10}" title="10 digit number" required></div>
          <div class="field"><label for="branch">Branch</label><select id="branch" required></select></div>
          <div class="field"><label for="year">Year</label><select id="year" required><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
          <div class="field"><label for="cgpa">CGPA</label><input id="cgpa" type="number" step="0.01" min="0" max="10" required></div>
          <div class="field full"><label for="skills">Skills</label><input id="skills" placeholder="Java, Spring Boot, SQL, React">
            <span class="hint">Separate skills with commas.</span><div id="skillChips"></div></div>
          <div class="field full"><label for="certifications">Certifications</label><input id="certifications" placeholder="Oracle Java SE, AWS Cloud Practitioner">
            <span class="hint">Separate certifications with commas.</span></div>
          <div class="field full"><label for="resumeLink">Resume link</label><input id="resumeLink" type="url" placeholder="https://drive.google.com/..."></div>
        </div>
        <button class="btn" id="saveBtn">Save changes</button>
      </form>
    </div>
  </div>
  <script src="../../js/config.js"></script>
  <script src="../../js/services/apiClient.js"></script>
  <script src="../../js/services/services.js"></script>
  <script src="../../js/components/ui.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/pages/student-profile.js"></script>
</body>
</html>
